# Baugruppenbaum. id ist ein Pfad (boiler.group.piston -> Eltern boiler.group -> boiler).
# detachable: wird als Einheit abgenommen; alles darin bleibt zusammen ("Werkbank").
# explode: Richtung im Weltrahmen (CAD: Z oben, -Y vorn, +X rechts), Weg in mm, Stufe der Explosionsansicht.
#   distance_mm = Weg in der Explosionsansicht (zusätzlich zu den Eltern-Baugruppen) und Ausbauweg. Am Ende jeder
#   Stufe und am Ende jedes Anleitungsschritts darf sich nichts überdecken (make validate, Prüfungen 8 und 10).
#   removal_mm = abweichender Ausbauweg, solange die Einheit an der Maschine sitzt; auf der Werkbank gilt distance_mm.
# requires_removed: was vorher raus muss, damit die Einheit entlang der Achse frei herauskommt.
- id: boiler
  pos: null
  name: {de: "Kessel mit Anbauteilen", en: "Boiler with fittings", it: "Caldaia con accessori"}
  detachable: true
  explode: {axis: [0, 0, 1], distance_mm: 170, stage: 1}
  requires_removed: [heating, portafilter]
  notes: {de: "Kessel samt Gruppe, Schauglas, Dampfhahn und Sicherheitsventil. Wird nach Ausbau des Heizelements gegen den Uhrzeigersinn (von oben) aus dem Basisring geschraubt (Q11)."}
