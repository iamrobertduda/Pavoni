- {name: "Manometer Durchmesser", target: 43, measure: "slice_extent('p069_gauge__1', 'z', bbox('p069_gauge__1').z1 - 0.5 * bbox('x001_gauge_dial__1').dz, 'x')", source: "8.2", note: "Katalog 41 mm (Q15-Händler); Schnitt durch die Gehäusemitte, leicht schräg"}
