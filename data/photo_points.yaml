    - {name: "Kessel Schulter hinten", px: [287, 965], p: "(0, datum('R'), datum('boiler_shoulder_z'))"}
    - {name: "Kessel Fuß hinten", px: [292, 1832], p: "(0, dim('boiler_foot_od') / 2, datum('boiler_foot_z'))"}
    - {name: "Dampfknauf Mitte", px: [167, 837], p: "(-dim('steam_total_w') / 2 + 10, dim('steam_back'), datum('steam_z'))"}
