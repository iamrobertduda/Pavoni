# Punktkorrespondenzen für die Kamera-Anpassung der Referenzfotos (cad/pavoni/camfit.py).
# px = Pixel im Originalfoto (Breite, Höhe), p = 3D-Punkt in CAD-mm als Ausdruck über datum()/dim().
# Von Hand aus vergrößerten Ausschnitten abgelesen (Genauigkeit ca. ±10 px).
B3_left.jpg:
  size: [1932, 2576]
  points:
    - {name: "Hutmutter oben", px: [1068, 612], p: "(0, datum('group_xy')[1], datum('cap_nut_top_z'))"}
    - {name: "Hinterer Bolzen (Kopf)", px: [962, 790], p: "(-14.5, datum('roller_y'), datum('roller_z'))"}
